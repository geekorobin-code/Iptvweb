<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<title>GeekoIPTV Car Lite</title>
<style>
:root{
  --bg:#090a0d;--panel:#12141a;--panel2:#181b23;--line:#2a2e39;
  --text:#f7f8fb;--muted:#a4abb8;--accent:#9b4dff;--danger:#ff5b7a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding-bottom:84px}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;background:rgba(9,10,13,.97);
  border-bottom:1px solid var(--line)
}
.logo{font-size:23px;font-weight:900;white-space:nowrap}
.logo b{color:var(--accent)}
.search{flex:1}
.search input{
  width:100%;background:#12151d;color:white;border:1px solid var(--line);
  border-radius:16px;padding:14px 17px;font-size:18px;outline:none
}
.iconbtn{
  border:0;background:#181b23;color:white;border-radius:14px;
  padding:13px 16px;font-size:18px
}

main{padding:20px}
.hero{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding:22px;border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(135deg,#11131a,#17121f);margin-bottom:24px
}
.hero h1{margin:0 0 6px;font-size:30px}
.hero p{margin:0;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.sectionHead h2{margin:0;font-size:23px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.row{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,28vw);
  overflow-x:auto;gap:14px;padding-bottom:7px
}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;min-width:0
}
.card img{
  display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#20232a
}
.row .card img{aspect-ratio:16/9}
.placeholder{width:100%;aspect-ratio:2/3;background:#20232a}
.row .placeholder{aspect-ratio:16/9}
.cardBody{padding:11px}
.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card button,.primary,.secondary{
  border:0;border-radius:12px;padding:11px 14px;font-weight:800
}
.card button{width:100%;margin-top:9px;background:#252936;color:#fff}
.primary{background:var(--accent);color:white}
.secondary{background:#242832;color:white}
.progress{height:5px;background:#2a2e37;border-radius:20px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent)}
.empty{
  padding:22px;border:1px dashed #343947;border-radius:16px;
  color:var(--muted);background:#0e1015
}

nav{
  position:fixed;z-index:40;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(9,10,13,.98);border-top:1px solid var(--line);
  padding:8px 10px max(8px,env(safe-area-inset-bottom))
}
nav button{
  border:0;background:transparent;color:#aeb5c0;border-radius:13px;
  padding:9px;font-weight:750
}
nav button.active{background:#1f172b;color:#fff}

.modal{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);
  display:flex;align-items:center;justify-content:center;padding:18px
}
.box{
  width:min(760px,100%);max-height:90vh;overflow:auto;
  background:#11141a;border:1px solid #303542;border-radius:22px;padding:20px
}
.box h3{margin:0 0 15px;font-size:25px}
.info{
  background:#171a22;border-radius:14px;padding:14px;color:#c0c6d0;margin-bottom:16px
}
label{display:block;color:#b8bfca;font-size:13px;margin:10px 0 5px}
.box input{
  width:100%;background:#0d0f14;border:1px solid #303542;
  border-radius:12px;color:#fff;padding:13px
}
.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.error{color:#ff7791;margin-top:12px;font-size:14px}
.ok{color:#7fe7a8;margin-top:12px;font-size:14px}

.player{position:fixed;inset:0;z-index:100;background:#000}
.playerbar{
  height:58px;display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:#0b0c0f
}
.player video{width:100%;height:calc(100vh - 58px);background:#000}
.episode{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:12px;
  margin:8px 0;background:#171a21
}
.episode span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:700px){
  header{flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .grid{grid-template-columns:repeat(2,1fr)}
  .row{grid-auto-columns:78vw}
  .hero{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<header>
  <div class="logo">Geeko<b>IPTV</b> Car</div>
  <div class="search"><input id="q" placeholder="Rechercher un film ou une série…"></div>
  <button class="iconbtn" id="settings" aria-label="Réglages">⚙️</button>
</header>

<main>
  <section id="home">
    <div class="hero">
      <div>
        <h1>Que veux-tu regarder ? 🚗</h1>
        <p>Version légère pensée pour le navigateur de la voiture.</p>
      </div>
      <span id="state" class="status">À configurer</span>
    </div>

    <div class="sectionHead"><h2>Reprendre</h2></div>
    <div id="resume" class="row"></div>

    <div class="sectionHead"><h2>Récemment ajoutés</h2></div>
    <div id="recent" class="grid"></div>
  </section>

  <section id="movies" class="hidden">
    <div class="sectionHead"><h2>Films</h2><span id="mc" class="status"></span></div>
    <div id="mg" class="grid"></div>
  </section>

  <section id="series" class="hidden">
    <div class="sectionHead"><h2>Séries</h2><span id="sc" class="status"></span></div>
    <div id="sg" class="grid"></div>
  </section>

  <section id="searchView" class="hidden">
    <div class="sectionHead"><h2>Recherche</h2></div>
    <div id="results" class="grid"></div>
  </section>
</main>

<nav>
  <button data-v="home" class="active">🏠<br>Accueil</button>
  <button data-v="movies">🎬<br>Films</button>
  <button data-v="series">📺<br>Séries</button>
  <button data-v="searchView">🔎<br>Recherche</button>
</nav>

<div id="settingsModal" class="modal hidden">
  <div class="box">
    <h3>Connexion IPTV</h3>
    <div class="info">
      Le site passe par ton relais HTTPS. Les identifiants restent enregistrés uniquement dans ce navigateur.
    </div>
    <label>Adresse HTTPS du relais</label>
    <input id="relay" placeholder="https://ton-relais.example.com">
    <label>Nom d’utilisateur</label>
    <input id="user" autocomplete="username">
    <label>Mot de passe</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="buttons">
      <button class="secondary" id="cancel">Fermer</button>
      <button class="primary" id="save">Enregistrer & tester</button>
    </div>
    <div id="test"></div>
  </div>
</div>

<div id="detail" class="modal hidden">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h3 id="dt"></h3>
      <button class="secondary" id="dc">✕</button>
    </div>
    <div id="db"></div>
  </div>
</div>

<div id="player" class="player hidden">
  <div class="playerbar">
    <strong id="pt"></strong>
    <button class="secondary" id="pc">✕ Fermer</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let all = [];
let playing = null;
let lastSave = 0;

const get = (k,d) => {
  try { return JSON.parse(localStorage.getItem(k)) ?? d; }
  catch { return d; }
};
const set = (k,v) => localStorage.setItem(k, JSON.stringify(v));
const config = () => get("geeko_car_cfg",{});
const progress = () => get("geeko_car_progress",[]);
const clean = u => (u || "").trim().replace(/\/+$/,"");
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[m]));
const quote = s => String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

function proxy(path){
  const relay = clean(config().relay);
  return relay + "/proxy/" + path.replace(/^\/+/,"");
}

async function api(action, extra={}){
  const c = config();
  if(!c.relay || !c.user || !c.pass) throw Error("Connexion non configurée");
  const p = new URLSearchParams({
    username:c.user,
    password:c.pass,
    action,
    ...extra
  });
  const r = await fetch(proxy("player_api.php?"+p.toString()));
  if(!r.ok) throw Error("HTTP "+r.status);
  return r.json();
}

function stream(x){
  const c = config();
  if(x.type === "movie"){
    return proxy(`movie/${encodeURIComponent(c.user)}/${encodeURIComponent(c.pass)}/${x.stream_id}.${x.ext || "mp4"}`);
  }
  return proxy(`series/${encodeURIComponent(c.user)}/${encodeURIComponent(c.pass)}/${x.id}.${x.ext || "mp4"}`);
}

function card(x, row=false){
  const p = progress().find(v => v.uid === x.uid);
  return `
  <article class="card">
    ${x.image ? `<img src="${esc(x.image)}" alt="">` : `<div class="placeholder"></div>`}
    <div class="cardBody">
      <div class="title">${esc(x.name)}</div>
      <div class="sub">${esc(x.info || "")}</div>
      ${p ? `<div class="progress"><i style="width:${p.percent}%"></i></div>` : ""}
      <button onclick="openItem('${quote(x.uid)}')">${p ? "▶ Reprendre" : "Ouvrir"}</button>
    </div>
  </article>`;
}

function render(){
  const movies = all.filter(x => x.type === "movie");
  const series = all.filter(x => x.type === "series");
  const p = progress();

  $("#resume").innerHTML = p.length
    ? p.slice(0,12).map(x => card(x,true)).join("")
    : '<div class="empty">Aucune lecture en cours.</div>';

  $("#recent").innerHTML = all.length
    ? all.slice(0,24).map(x => card(x)).join("")
    : '<div class="empty">Configure ton accès IPTV avec ⚙️.</div>';

  $("#mg").innerHTML = movies.map(x => card(x)).join("");
  $("#sg").innerHTML = series.map(x => card(x)).join("");
  $("#mc").textContent = movies.length ? movies.length + " films" : "";
  $("#sc").textContent = series.length ? series.length + " séries" : "";

  search($("#q").value);
}

function view(v){
  ["home","movies","series","searchView"].forEach(x =>
    $("#"+x).classList.toggle("hidden", x !== v)
  );
  $$("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.v === v)
  );
  if(v === "searchView") $("#q").focus();
}

$$("nav button").forEach(b => b.onclick = () => view(b.dataset.v));

function search(q){
  q = (q || "").trim().toLowerCase();
  const results = q
    ? all.filter(x => (x.name+" "+x.info).toLowerCase().includes(q))
    : [];
  $("#results").innerHTML = q
    ? (results.length ? results.map(x => card(x)).join("") : '<div class="empty">Aucun résultat.</div>')
    : '<div class="empty">Tape un titre ci-dessus.</div>';
}

$("#q").oninput = e => {
  search(e.target.value);
  if(e.target.value.trim()) view("searchView");
};

async function openItem(uid){
  const x = all.find(v => v.uid === uid) || progress().find(v => v.uid === uid);
  if(!x) return;

  $("#dt").textContent = x.name;
  $("#detail").classList.remove("hidden");

  if(x.type === "movie"){
    $("#db").innerHTML = `
      ${x.image ? `<img src="${esc(x.image)}" alt="" style="width:100%;max-height:340px;object-fit:cover;border-radius:16px">` : ""}
      <p class="status">${esc(x.info || "")}</p>
      <button class="primary" onclick="playMovie('${quote(uid)}')">▶ Lire</button>
    `;
    return;
  }

  $("#db").innerHTML = '<div class="empty">Chargement des épisodes…</div>';

  try{
    const data = await api("get_series_info",{series_id:x.series_id});
    const eps = [];

    Object.keys(data.episodes || {})
      .sort((a,b) => Number(a)-Number(b))
      .forEach(season => {
        (data.episodes[season] || []).forEach(e => {
          eps.push({
            id:e.id,
            ext:e.container_extension || "mp4",
            season,
            episode:e.episode_num || "",
            title:e.title || ("Épisode " + e.episode_num)
          });
        });
      });

    $("#db").innerHTML = eps.length
      ? eps.map(e => `
        <div class="episode">
          <span>S${String(e.season).padStart(2,"0")} E${String(e.episode).padStart(2,"0")} — ${esc(e.title)}</span>
          <button class="primary" onclick="playEp('${quote(uid)}','${quote(e.id)}','${quote(e.ext)}','${quote(e.title)}')">▶</button>
        </div>`).join("")
      : '<div class="empty">Aucun épisode trouvé.</div>';

  }catch(e){
    $("#db").innerHTML = '<div class="empty">Erreur : '+esc(e.message)+'</div>';
  }
}

window.openItem = openItem;

window.playMovie = uid => {
  const x = all.find(v => v.uid === uid) || progress().find(v => v.uid === uid);
  if(x) start(x, stream(x));
};

window.playEp = (seriesUid,id,ext,title) => {
  const s = all.find(v => v.uid === seriesUid);
  if(!s) return;
  const x = {
    uid:"e"+id,
    id,
    type:"episode",
    name:s.name+" — "+title,
    image:s.image,
    info:title,
    ext
  };
  start(x, stream(x));
};

function start(x,url){
  playing = x;
  $("#detail").classList.add("hidden");
  $("#pt").textContent = x.name;
  $("#player").classList.remove("hidden");

  const v = $("#video");
  const p = progress().find(a => a.uid === x.uid);
  v.src = url;

  v.onloadedmetadata = () => {
    if(p?.seconds && p.seconds < v.duration - 15) v.currentTime = p.seconds;
  };
  v.play().catch(()=>{});
}

function saveProgress(){
  const v = $("#video");
  if(!playing || !isFinite(v.duration) || v.duration <= 0) return;

  const percent = Math.round(v.currentTime / v.duration * 100);
  let p = progress().filter(x => x.uid !== playing.uid);

  if(percent < 95 && v.currentTime > 5){
    p.unshift({...playing,seconds:v.currentTime,percent});
  }

  set("geeko_car_progress", p.slice(0,20));
}

$("#video").ontimeupdate = () => {
  if(Date.now() - lastSave > 5000){
    lastSave = Date.now();
    saveProgress();
  }
};

$("#video").onended = () => {
  if(playing){
    set("geeko_car_progress", progress().filter(x => x.uid !== playing.uid));
  }
  render();
};

$("#pc").onclick = () => {
  saveProgress();
  const v = $("#video");
  v.pause();
  v.removeAttribute("src");
  v.load();
  $("#player").classList.add("hidden");
  playing = null;
  render();
};

$("#dc").onclick = () => $("#detail").classList.add("hidden");

function showSettings(){
  const c = config();
  $("#relay").value = c.relay || "";
  $("#user").value = c.user || "";
  $("#pass").value = c.pass || "";
  $("#test").className = "";
  $("#test").textContent = "";
  $("#settingsModal").classList.remove("hidden");
}

$("#settings").onclick = showSettings;
$("#cancel").onclick = () => $("#settingsModal").classList.add("hidden");

$("#save").onclick = async () => {
  const c = {
    relay: clean($("#relay").value),
    user: $("#user").value.trim(),
    pass: $("#pass").value
  };

  set("geeko_car_cfg", c);
  $("#test").className = "status";
  $("#test").textContent = "Test du relais…";

  try{
    const h = await fetch(c.relay + "/sante");
    if(!h.ok) throw Error("Relais HTTP " + h.status);

    $("#test").textContent = "Relais OK — connexion IPTV…";
    await load();

    $("#test").className = "ok";
    $("#test").textContent = "Connexion réussie.";
    setTimeout(() => $("#settingsModal").classList.add("hidden"), 500);

  }catch(e){
    $("#test").className = "error";
    $("#test").textContent = "❌ " + e.message;
  }
};

async function load(){
  $("#state").textContent = "Chargement…";

  const [vod, ser] = await Promise.all([
    api("get_vod_streams"),
    api("get_series")
  ]);

  const movies = (Array.isArray(vod) ? vod : []).map(x => ({
    uid:"m"+x.stream_id,
    type:"movie",
    stream_id:x.stream_id,
    name:x.name || "Film",
    image:x.stream_icon || "",
    ext:x.container_extension || "mp4",
    info:[
      x.release_date || x.releaseDate,
      x.rating && "★ " + x.rating
    ].filter(Boolean).join(" • ")
  }));

  const series = (Array.isArray(ser) ? ser : []).map(x => ({
    uid:"s"+x.series_id,
    type:"series",
    series_id:x.series_id,
    name:x.name || "Série",
    image:x.cover || "",
    info:[
      x.releaseDate,
      x.rating && "★ " + x.rating
    ].filter(Boolean).join(" • ")
  }));

  all = [...movies, ...series];
  $("#state").textContent = "Connecté • " + all.length + " contenus";
  render();
}

(async () => {
  render();
  const c = config();

  if(c.relay && c.user && c.pass){
    try{
      await load();
    }catch(e){
      $("#state").textContent = "Relais indisponible";
    }
  }else{
    showSettings();
  }
})();
</script>
</body>
</html>
